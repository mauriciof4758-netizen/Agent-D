<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
  <title>PLAGUE.AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
  <style>
    :root{
      --bg:#04040a;--surf:#0c0c18;
      --g1:#4dff91;--r1:#ff3535;--o1:#ff7730;--b1:#40b0ff;--y1:#ffd040;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);color:#ccc;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;overflow-x:hidden}

    /* scanline overlay */
    body::after{content:'';position:fixed;inset:0;pointer-events:none;z-index:999;
      background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.1) 3px,rgba(0,0,0,.1) 4px)}

    /* radial bg glow */
    .bg-glow{position:fixed;width:400px;height:400px;border-radius:50%;top:-120px;left:50%;transform:translateX(-50%);
      background:radial-gradient(circle,rgba(77,255,145,.05) 0%,transparent 70%);pointer-events:none;z-index:0}

    .wrap{position:relative;z-index:1;padding:14px;max-width:430px;margin:0 auto;padding-bottom:28px}

    /* ── header ── */
    header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
    .hazard{font-size:34px;color:var(--g1);animation:spin 10s linear infinite;
      text-shadow:0 0 18px rgba(77,255,145,.55);line-height:1;flex-shrink:0}
    @keyframes spin{to{transform:rotate(360deg)}}
    .htext h1{font-size:22px;font-weight:800;letter-spacing:3px;color:var(--g1);
      text-shadow:0 0 14px rgba(77,255,145,.5)}
    .htext .dname{font-size:10px;color:#555;letter-spacing:2px;margin-top:1px}
    .turn-chip{margin-left:auto;background:#0c0c18;border:1px solid #1c2c1c;border-radius:8px;
      padding:5px 10px;font-size:12px;color:var(--g1);font-variant-numeric:tabular-nums;white-space:nowrap}

    /* ── phase badge ── */
    .phase{display:inline-block;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;
      letter-spacing:2px;margin-bottom:12px}
    .ph-idle{background:#111;color:#444;border:1px solid #222}
    .ph-train{background:rgba(77,255,145,.1);color:var(--g1);border:1px solid rgba(77,255,145,.3)}
    .ph-play{background:rgba(255,55,55,.1);color:var(--r1);border:1px solid rgba(255,55,55,.3);
      animation:pblink 1.4s ease-in-out infinite}
    .ph-done{background:rgba(77,255,145,.12);color:var(--g1);border:1px solid rgba(77,255,145,.35)}
    @keyframes pblink{0%,100%{opacity:1}50%{opacity:.55}}

    /* ── global stats ── */
    .gstats{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:13px}
    .gs{background:var(--surf);border:1px solid #111;border-radius:10px;padding:8px 10px}
    .gs-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
    .gs-lbl{font-size:9px;color:#444;letter-spacing:1px}
    .gs-val{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums}
    .gs-bg{height:4px;background:#111;border-radius:2px;overflow:hidden}
    .gs-fill{height:4px;border-radius:2px;transition:width .45s,background .45s}

    /* ── action flash ── */
    .aflash{min-height:30px;margin-bottom:10px;padding:5px 12px;border-radius:8px;
      font-size:11px;font-weight:600;letter-spacing:.5px;text-align:center;
      transition:opacity .35s;opacity:0}
    .aflash.on{opacity:1;background:rgba(255,120,0,.12);color:var(--o1);border:1px solid rgba(255,120,0,.28)}

    /* ── world map ── */
    .map-wrap{position:relative;margin-bottom:12px;border-radius:14px;overflow:hidden;
      background:#070710;border:1px solid #0f0f20}
    .map-svg{width:100%;display:block}
    /* region circles drawn via JS onto SVG */

    /* ── region grid ── */
    .rgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
    .rcard{background:var(--surf);border:1px solid #131320;border-radius:10px;
      padding:8px 7px;position:relative;overflow:hidden;transition:border-color .4s,box-shadow .4s}
    .rcard.lo{border-color:rgba(255,210,40,.22);box-shadow:0 0 8px rgba(255,210,40,.08)}
    .rcard.mid{border-color:rgba(255,110,0,.4);box-shadow:0 0 10px rgba(255,110,0,.15);
      animation:rpulse-o 2.2s ease-in-out infinite}
    .rcard.hi{border-color:rgba(255,35,35,.5);box-shadow:0 0 14px rgba(255,35,35,.22);
      animation:rpulse-r 1.6s ease-in-out infinite}
    @keyframes rpulse-o{0%,100%{box-shadow:0 0 8px rgba(255,110,0,.1)}50%{box-shadow:0 0 18px rgba(255,110,0,.35)}}
    @keyframes rpulse-r{0%,100%{box-shadow:0 0 10px rgba(255,35,35,.18)}50%{box-shadow:0 0 22px rgba(255,35,35,.5)}}
    .det-dot{position:absolute;top:5px;right:5px;width:6px;height:6px;border-radius:50%;
      background:var(--r1);box-shadow:0 0 6px var(--r1)}
    .rname{font-size:9px;color:#444;letter-spacing:.5px;margin-bottom:4px}
    .rpct{font-size:17px;font-weight:800;line-height:1;margin-bottom:4px}
    .rbar-bg{height:3px;background:#0f0f1a;border-radius:2px;overflow:hidden}
    .rbar{height:3px;border-radius:2px;transition:width .5s,background .5s}

    /* ── log ── */
    .logsec{background:var(--surf);border:1px solid #111;border-radius:10px;padding:10px;margin-bottom:12px}
    .loghd{font-size:9px;letter-spacing:2px;color:#2a2a2a;margin-bottom:6px}
    .logbody{height:76px;overflow-y:auto}
    .le{font-size:11px;padding:2px 0;color:#333;border-bottom:1px solid #0d0d18}
    .le.ev{color:var(--o1)}.le.win{color:var(--g1)}.le.bad{color:var(--r1)}

    /* ── training ── */
    .trainsec{background:var(--surf);border:1px solid #131320;border-radius:10px;padding:12px;margin-bottom:12px}
    .trainhd{font-size:9px;letter-spacing:2px;color:#2a2a2a;margin-bottom:10px}
    .tpbg{height:8px;background:#0a0a0a;border-radius:4px;overflow:hidden;margin-bottom:8px}
    .tpfill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--g1),#00cc60);transition:width .3s}
    .tmeta{display:flex;justify-content:space-between;font-size:11px;color:#333}
    .tmeta span:last-child{color:var(--g1)}
    .tnote{font-size:10px;color:#2a2a2a;text-align:center;margin-top:6px}

    /* ── buttons ── */
    .btns{display:flex;flex-direction:column;gap:8px}
    .btn{width:100%;padding:15px;border:none;border-radius:13px;font-size:15px;
      font-weight:700;letter-spacing:1px;cursor:pointer;transition:transform .1s,opacity .2s}
    .btn:active{transform:scale(.97)}.btn:disabled{opacity:.28;cursor:default}
    .btng{background:linear-gradient(135deg,#00cc55,#003d1a);color:#fff;
      box-shadow:0 4px 22px rgba(0,200,80,.28)}
    .btnr{background:linear-gradient(135deg,#cc2020,#440000);color:#fff;
      box-shadow:0 4px 22px rgba(200,30,30,.28)}
    .btns2{background:#0f0f18;color:#444;border:1px solid #1a1a28}

    /* ── result overlay ── */
    .rovl{position:fixed;inset:0;background:rgba(2,2,8,.93);display:flex;
      align-items:center;justify-content:center;z-index:500;
      opacity:0;pointer-events:none;transition:opacity .4s}
    .rovl.show{opacity:1;pointer-events:all}
    .rbox{background:#080810;border:1px solid #1a1a30;border-radius:22px;
      padding:34px 24px;text-align:center;max-width:300px;width:90%}
    .rico{font-size:66px;margin-bottom:12px;
      animation:rbounce .55s cubic-bezier(.36,.07,.19,.97) both}
    @keyframes rbounce{0%{transform:scale(.2)}60%{transform:scale(1.12)}80%{transform:scale(.94)}100%{transform:scale(1)}}
    .rtitle{font-size:26px;font-weight:800;letter-spacing:2px;margin-bottom:8px}
    .rtitle.win{color:var(--g1);text-shadow:0 0 22px rgba(77,255,145,.55)}
    .rtitle.lose{color:var(--r1);text-shadow:0 0 22px rgba(255,50,50,.55)}
    .rstats{font-size:13px;color:#444;margin-bottom:24px;line-height:1.9}
    .rstats b{color:#777}
  </style>
</head>
<body>
<div class="bg-glow"></div>
<div class="wrap">

  <header>
    <div class="hazard">☣</div>
    <div class="htext">
      <h1>PLAGUE.AI</h1>
      <div class="dname" id="dname">INITIALIZING…</div>
    </div>
    <div class="turn-chip">T-<span id="s-turn">000</span></div>
  </header>

  <div class="phase ph-idle" id="phase">● READY</div>

  <div class="gstats">
    <div class="gs">
      <div class="gs-top"><span class="gs-lbl">INFECTED</span><span class="gs-val" id="v-inf" style="color:#ff7730">0.0%</span></div>
      <div class="gs-bg"><div class="gs-fill" id="b-inf" style="width:0%;background:#ff7730"></div></div>
    </div>
    <div class="gs">
      <div class="gs-top"><span class="gs-lbl">DEAD</span><span class="gs-val" id="v-dead" style="color:#ff3535">0.0%</span></div>
      <div class="gs-bg"><div class="gs-fill" id="b-dead" style="width:0%;background:#ff3535"></div></div>
    </div>
    <div class="gs">
      <div class="gs-top"><span class="gs-lbl">CURE</span><span class="gs-val" id="v-cure" style="color:#40b0ff">0.0%</span></div>
      <div class="gs-bg"><div class="gs-fill" id="b-cure" style="width:0%;background:#40b0ff"></div></div>
    </div>
    <div class="gs">
      <div class="gs-top"><span class="gs-lbl">DNA</span><span class="gs-val" id="v-dna" style="color:#4dff91">5</span></div>
      <div class="gs-bg"><div class="gs-fill" id="b-dna" style="width:2%;background:#4dff91"></div></div>
    </div>
  </div>

  <!-- Animated world map -->
  <div class="map-wrap">
    <svg id="map-svg" class="map-svg" viewBox="0 0 375 160" xmlns="http://www.w3.org/2000/svg">
      <!-- ocean -->
      <rect width="375" height="160" fill="#05050f"/>
      <!-- simplified continent shapes -->
      <g fill="#0e0e20" stroke="#151530" stroke-width=".5">
        <!-- Americas -->
        <path d="M18,14 L108,10 L122,42 L118,78 L100,96 L108,130 L122,158 L88,158 L62,138 L56,112 L28,92 L12,52 Z"/>
        <!-- Europe -->
        <path d="M152,12 L204,10 L210,38 L194,52 L162,48 L146,28 Z"/>
        <!-- Africa -->
        <path d="M152,56 L212,52 L228,80 L220,140 L194,155 L166,140 L148,108 L150,72 Z"/>
        <!-- Eurasia (Russia + C.Asia + China) -->
        <path d="M160,8 L370,5 L368,52 L330,56 L296,52 L262,54 L222,52 L174,42 L158,22 Z"/>
        <!-- Middle East -->
        <path d="M212,54 L262,52 L268,78 L244,90 L214,84 Z"/>
        <!-- India -->
        <path d="M252,84 L282,78 L288,126 L268,138 L248,116 Z"/>
        <!-- SE Asia -->
        <path d="M308,56 L366,50 L368,96 L336,100 L304,88 Z"/>
        <!-- SE Asia lower -->
        <path d="M308,96 L368,96 L366,132 L340,138 L308,116 Z"/>
        <!-- Oceania -->
        <path d="M322,140 L374,136 L372,158 L344,158 L320,150 Z"/>
      </g>
      <!-- Region nodes + labels drawn by JS -->
      <g id="map-nodes"></g>
      <!-- Connection lines -->
      <g id="map-lines" stroke="rgba(77,255,145,0.07)" stroke-width=".8" fill="none"></g>
      <!-- Particles -->
      <g id="map-particles"></g>
    </svg>
  </div>

  <div class="aflash" id="aflash"></div>

  <div class="rgrid" id="rgrid"></div>

  <div class="logsec">
    <div class="loghd">◈ TRANSMISSION LOG</div>
    <div class="logbody" id="logbody"></div>
  </div>

  <div class="trainsec">
    <div class="trainhd">◈ NEURAL NETWORK STATUS</div>
    <div class="tpbg"><div class="tpfill" id="tpfill" style="width:0%"></div></div>
    <div class="tmeta">
      <span id="ep-stat">Awaiting training</span>
      <span id="wr-stat">—</span>
    </div>
    <div class="tnote" id="tnote">Train the AI to learn how to infect the world</div>
  </div>

  <div class="btns">
    <button class="btn btng" id="btn-train" onclick="startTraining()">🧬 TRAIN NEURAL NETWORK</button>
    <button class="btn btnr" id="btn-play"  onclick="startPlay()" disabled>☣ WATCH AI PLAY</button>
    <button class="btn btns2" id="btn-stop" onclick="stopAll()" disabled>⏹ STOP</button>
  </div>
</div>

<!-- Result overlay -->
<div class="rovl" id="rovl">
  <div class="rbox">
    <div class="rico" id="rico"></div>
    <div class="rtitle" id="rtitle"></div>
    <div class="rstats" id="rstats"></div>
    <button class="btn btnr" onclick="hideResult();startPlay()">PLAY AGAIN</button>
  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════
const STATE_SIZE  = 45;
const ACTION_SIZE = 25;
const MAX_TURNS   = 500;
const GAMMA       = 0.99;
const BATCH_SIZE  = 32;
const BUF_MAX     = 8000;
const TARGET_SYNC = 150;
const TRAIN_EPS   = 300;

const ACTIONS = [
  {n:"Wait",              c:0,  p:[],    i:0.00,l:0.000,v: 0.00,s:0.00},
  {n:"Air Trans. 1",      c:3,  p:[],    i:0.15,l:0.000,v: 0.00,s:0.00},
  {n:"Air Trans. 2",      c:5,  p:[1],   i:0.15,l:0.000,v: 0.00,s:0.00},
  {n:"Water Trans. 1",    c:3,  p:[],    i:0.15,l:0.000,v: 0.00,s:0.00},
  {n:"Water Trans. 2",    c:5,  p:[3],   i:0.15,l:0.000,v: 0.00,s:0.00},
  {n:"Drug Resist. 1",    c:6,  p:[],    i:0.00,l:0.000,v: 0.00,s:0.20},
  {n:"Drug Resist. 2",    c:15, p:[5],   i:0.00,l:0.000,v: 0.00,s:0.30},
  {n:"Cold Resist. 1",    c:5,  p:[],    i:0.10,l:0.000,v: 0.00,s:0.00},
  {n:"Cold Resist. 2",    c:10, p:[7],   i:0.10,l:0.000,v: 0.00,s:0.00},
  {n:"Heat Resist. 1",    c:5,  p:[],    i:0.10,l:0.000,v: 0.00,s:0.00},
  {n:"Heat Resist. 2",    c:10, p:[9],   i:0.10,l:0.000,v: 0.00,s:0.00},
  {n:"Coughing",          c:3,  p:[],    i:0.10,l:0.002,v: 0.05,s:0.00},
  {n:"Sneezing",          c:2,  p:[],    i:0.08,l:0.000,v: 0.03,s:0.00},
  {n:"Rash",              c:2,  p:[],    i:0.05,l:0.001,v: 0.04,s:0.00},
  {n:"Sweating",          c:2,  p:[],    i:0.03,l:0.000,v: 0.02,s:0.00},
  {n:"Vomiting",          c:4,  p:[],    i:0.12,l:0.003,v: 0.08,s:0.00},
  {n:"Fever",             c:3,  p:[],    i:0.05,l:0.002,v: 0.10,s:0.00},
  {n:"Pneumonia",         c:8,  p:[11],  i:0.15,l:0.010,v: 0.15,s:0.00},
  {n:"Pulmonary Edema",   c:15, p:[17],  i:0.05,l:0.020,v: 0.20,s:0.00},
  {n:"Organ Failure",     c:20, p:[18],  i:0.00,l:0.040,v: 0.30,s:0.00},
  {n:"Hemorrhagic Shock", c:25, p:[19],  i:0.05,l:0.030,v: 0.25,s:0.00},
  {n:"Gen. Hardening 1",  c:10, p:[],    i:0.00,l:0.000,v: 0.00,s:0.25},
  {n:"Gen. Hardening 2",  c:15, p:[21],  i:0.00,l:0.000,v: 0.00,s:0.30},
  {n:"Gen. Re-shuffle",   c:16, p:[],    i:0.00,l:0.000,v: 0.00,s:0.00},
  {n:"Symptom Suppress.", c:12, p:[],    i:0.00,l:0.000,v:-0.50,s:0.00},
];

// Region definitions + their (x,y) positions on the 375×160 SVG map
const REGIONS = [
  {n:"N. America",  pop:500e6,  clim:"t",h:8.5,pov:3.0, mx:62,  my:54},
  {n:"Europe",      pop:750e6,  clim:"c",h:9.0,pov:2.0, mx:178, my:32},
  {n:"S. America",  pop:420e6,  clim:"h",h:5.0,pov:6.0, mx:82,  my:130},
  {n:"Africa",      pop:1300e6, clim:"h",h:3.0,pov:8.5, mx:186, my:108},
  {n:"Mid. East",   pop:400e6,  clim:"h",h:6.0,pov:5.0, mx:238, my:68},
  {n:"India",       pop:1400e6, clim:"h",h:4.0,pov:7.0, mx:268, my:108},
  {n:"China",       pop:1400e6, clim:"t",h:7.0,pov:4.0, mx:322, my:38},
  {n:"SE Asia",     pop:700e6,  clim:"h",h:5.0,pov:6.0, mx:338, my:88},
  {n:"Russia",      pop:144e6,  clim:"c",h:6.0,pov:5.0, mx:272, my:18},
  {n:"Oceania",     pop:45e6,   clim:"h",h:8.5,pov:2.5, mx:348, my:148},
  {n:"C. Asia",     pop:100e6,  clim:"c",h:4.0,pov:7.0, mx:252, my:46},
  {n:"Islands",     pop:100e6,  clim:"h",h:4.5,pov:5.5, mx:358, my:118},
];

// Adjacency for visual connection lines
const EDGES = [
  [0,1],[0,2],[1,3],[1,4],[1,8],[2,3],[3,4],[4,5],[4,10],
  [5,7],[5,10],[6,7],[6,8],[6,10],[7,9],[7,11],[9,11]
];

// Disease name generator
const DPRE  = ['XENO','NECRO','DELTA','SIGMA','APEX','NOVA','HYPER','ULTRA','PROTO'];
const DROOT = ['VIRUS','PLAGUE','MORPH','STRAIN','BOLA','PATHY','FLUX'];
const DSUF  = ['-X','-7','-19','-Z','-PRIME','-OMEGA'];
function genName(){
  return DPRE[~~(Math.random()*DPRE.length)]
       + DROOT[~~(Math.random()*DROOT.length)]
       + DSUF[~~(Math.random()*DSUF.length)];
}

// ═══════════════════════════════════════════════════════
//  SIMULATION
// ═══════════════════════════════════════════════════════
class PlagueGame {
  constructor(){this.reset()}
  reset(){
    this.regions=REGIONS.map(r=>({...r,inf:0,dead:0,det:false}));
    this.upgrades=new Array(ACTION_SIZE).fill(false);
    this.dna=5; this.cure=0; this.turn=0;
    this.done=false; this.won=false;
    this.infectivity=0.05; this.lethality=0.001;
    this.visibility=0; this.cureSlow=0;
    const s=[3,5,7,6,4];
    this.regions[s[~~(Math.random()*s.length)]].inf=1000;
    return this._state();
  }
  _tp(){ return this.regions.reduce((a,r)=>a+r.pop,0) }
  _ti(){ return this.regions.reduce((a,r)=>a+r.inf,0) }
  _td(){ return this.regions.reduce((a,r)=>a+r.dead,0) }
  _th(){ return this.regions.reduce((a,r)=>a+Math.max(0,r.pop-r.inf-r.dead),0) }
  _det(){ return this.regions.some(r=>r.det) }
  _cm(r){
    let m=1;
    if(r.clim==='c') m+=0.3*this.upgrades[7]+0.3*this.upgrades[8]-0.3;
    else if(r.clim==='h') m+=0.3*this.upgrades[9]+0.3*this.upgrades[10]-0.1;
    return Math.max(0.05,m);
  }
  _spread(){
    const tot=this._tp(), gp=this._ti()/tot;
    for(const r of this.regions){
      const h=Math.max(0,r.pop-r.inf-r.dead);
      if(h<=0) continue;
      const lr=r.inf/r.pop;
      if(lr<=0&&gp<0.001) continue;
      let ni=(this.infectivity*this._cm(r)*(1+r.pov*.08)*Math.max(.1,1-r.h*.06)*lr*h);
      if(gp>0.005) ni+=h*gp*0.0003;
      ni=Math.min(h,Math.max(0,ni*(0.85+Math.random()*.3)));
      r.inf+=ni;
      const nd=Math.min(r.inf*.15,Math.max(0,r.inf*this.lethality*Math.max(.1,1-r.h*.07)));
      r.inf-=nd; r.dead+=nd;
      if(!r.det){
        const thr=Math.max(0.0005,0.008-this.visibility*0.004);
        if(r.inf/r.pop>thr&&Math.random()<0.08+r.h*0.025) r.det=true;
      }
    }
  }
  _cure(){
    if(!this._det()) return;
    const det=this.regions.filter(r=>r.det);
    const base=det.reduce((a,r)=>a+r.h/10,0)*.0025;
    this.cure=Math.min(1,this.cure+base*Math.max(.05,1-this.cureSlow)*Math.max(.1,1-this._td()/this._tp()*.6));
  }
  _dna(){
    const p=this._ti()/this._tp();
    this.dna=Math.min(200,this.dna+Math.sqrt(Math.max(0,p))*.6+p*.3+.1);
  }
  validActions(){
    const v=[];
    for(let i=0;i<ACTION_SIZE;i++){
      if(i===0){v.push(0);continue}
      if(this.upgrades[i]) continue;
      const a=ACTIONS[i];
      if(this.dna<a.c) continue;
      if(a.p.every(x=>this.upgrades[x])) v.push(i);
    }
    return v;
  }
  step(action){
    const tot=this._tp(),pc=this.cure,pai=this._ti()+this._td();
    let rw=0;
    if(action!==0){
      if(this.validActions().includes(action)){
        const a=ACTIONS[action];
        this.dna-=a.c; this.upgrades[action]=true;
        this.infectivity+=a.i; this.lethality+=a.l;
        this.visibility=Math.max(-1,this.visibility+a.v);
        this.cureSlow+=a.s;
        if(action===23) this.cure=Math.max(0,this.cure-.25);
        rw+=.1;
      } else rw-=.2;
    }
    this._spread(); this._cure(); this._dna(); this.turn++;
    rw+=(this._ti()+this._td()-pai)/tot*15;
    rw-=(this.cure-pc)*8;
    const hp=this._th()/tot, ip=this._ti()/tot, dp=this._td()/tot;
    let result='';
    if(this.cure>=1){this.done=true;this.won=false;rw-=20;result='cure'}
    else if(ip+dp>=.999||hp<1e-4){this.done=true;this.won=true;rw+=100;result='win'}
    else if(this.turn>=MAX_TURNS){this.done=true;this.won=false;rw-=10;result='timeout'}
    return{state:this._state(),reward:rw,done:this.done,result};
  }
  _state(){
    const tot=this._tp(), s=new Float32Array(STATE_SIZE);
    s[0]=this._ti()/tot; s[1]=this._td()/tot; s[2]=this.cure;
    s[3]=Math.min(1,this.dna/100); s[4]=this.turn/MAX_TURNS;
    for(let i=0;i<12;i++) s[5+i]=this.regions[i].inf/this.regions[i].pop;
    s[17]=Math.min(1,this.infectivity/.5); s[18]=Math.min(1,this.lethality/.1);
    s[19]=Math.max(-1,Math.min(1,this.visibility));
    for(let i=1;i<ACTION_SIZE;i++) s[19+i]=this.upgrades[i]?1:0;
    s[44]=this._det()?1:0;
    return s;
  }
}

// ═══════════════════════════════════════════════════════
//  DQN AGENT
// ═══════════════════════════════════════════════════════
class DQNAgent {
  constructor(){
    this.policy=this._net(); this.target=this._net();
    this._sync(); this.opt=tf.train.adam(.001);
    this.buf=[]; this.steps=0; this.epsilon=1;
  }
  _net(){
    const m=tf.sequential();
    m.add(tf.layers.dense({units:64,activation:'relu',inputShape:[STATE_SIZE]}));
    m.add(tf.layers.dense({units:64,activation:'relu'}));
    m.add(tf.layers.dense({units:ACTION_SIZE}));
    return m;
  }
  _sync(){ this.target.setWeights(this.policy.getWeights().map(w=>w.clone())) }
  act(state,valid){
    if(Math.random()<this.epsilon) return valid[~~(Math.random()*valid.length)];
    return tf.tidy(()=>{
      const q=this.policy.predict(tf.tensor2d([Array.from(state)],[1,STATE_SIZE])).dataSync();
      let best=valid[0],bq=-Infinity;
      for(const a of valid) if(q[a]>bq){bq=q[a];best=a;}
      return best;
    });
  }
  remember(s,a,r,ns,done){
    if(this.buf.length>=BUF_MAX) this.buf.shift();
    this.buf.push([Array.from(s),a,r,Array.from(ns),done?1:0]);
  }
  train(){
    if(this.buf.length<BATCH_SIZE) return;
    const idx=Array.from({length:BATCH_SIZE},()=>~~(Math.random()*this.buf.length));
    const b=idx.map(i=>this.buf[i]);
    const targets=tf.tidy(()=>{
      const ns=tf.tensor2d(b.map(x=>x[3]));
      const qn=this.target.predict(ns).max(1);
      const rw=tf.tensor1d(b.map(x=>x[2]));
      const dn=tf.tensor1d(b.map(x=>x[4]));
      return rw.add(qn.mul(GAMMA).mul(tf.scalar(1).sub(dn))).arraySync();
    });
    this.opt.minimize(()=>{
      const st=tf.tensor2d(b.map(x=>x[0]));
      const ac=tf.tensor1d(b.map(x=>x[1]),'int32');
      const qA=this.policy.predict(st);
      const msk=tf.oneHot(ac,ACTION_SIZE).cast('float32');
      const qS=qA.mul(msk).sum(1);
      const tg=tf.tensor1d(targets);
      const loss=tf.losses.meanSquaredError(tg,qS);
      tg.dispose(); return loss;
    });
    this.steps++;
    if(this.steps%TARGET_SYNC===0) this._sync();
  }
}

// ═══════════════════════════════════════════════════════
//  MAP DRAWING
// ═══════════════════════════════════════════════════════
function infCol(pct){
  if(pct<2)   return '#4dff91';
  if(pct<10)  return '#c8ff40';
  if(pct<25)  return '#ffd040';
  if(pct<55)  return '#ff7730';
  if(pct<80)  return '#ff4020';
  return '#ff1010';
}

function buildMap(){
  const linesG = document.getElementById('map-lines');
  EDGES.forEach(([a,b])=>{
    const ra=REGIONS[a], rb=REGIONS[b];
    const ln=document.createElementNS('http://www.w3.org/2000/svg','line');
    ln.setAttribute('x1',ra.mx); ln.setAttribute('y1',ra.my);
    ln.setAttribute('x2',rb.mx); ln.setAttribute('y2',rb.my);
    linesG.appendChild(ln);
  });

  const nodesG = document.getElementById('map-nodes');
  REGIONS.forEach((r,i)=>{
    // glow circle (outer)
    const glow=document.createElementNS('http://www.w3.org/2000/svg','circle');
    glow.setAttribute('cx',r.mx); glow.setAttribute('cy',r.my); glow.setAttribute('r','9');
    glow.setAttribute('fill','rgba(77,255,145,.06)'); glow.id='mg'+i;
    nodesG.appendChild(glow);
    // main dot
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',r.mx); c.setAttribute('cy',r.my); c.setAttribute('r','4.5');
    c.setAttribute('fill','#4dff91'); c.id='mn'+i;
    nodesG.appendChild(c);
    // label
    const tx=document.createElementNS('http://www.w3.org/2000/svg','text');
    tx.setAttribute('x',r.mx); tx.setAttribute('y',r.my+14);
    tx.setAttribute('text-anchor','middle'); tx.setAttribute('font-size','6.5');
    tx.setAttribute('fill','#444'); tx.setAttribute('font-family','-apple-system,sans-serif');
    tx.textContent=r.n; tx.id='ml'+i;
    nodesG.appendChild(tx);
  });
}

function updateMap(g){
  const tot=g._tp();
  REGIONS.forEach((r,i)=>{
    const pct=g.regions[i].inf/r.pop*100;
    const col=infCol(pct);
    const radius=4.5+pct*.12; // node grows with infection
    const glowR=9+pct*.25;
    const glowOp=Math.min(.7,0.05+pct*.012);
    document.getElementById('mn'+i).setAttribute('fill',col);
    document.getElementById('mn'+i).setAttribute('r',Math.min(14,radius));
    document.getElementById('mg'+i).setAttribute('r',Math.min(28,glowR));
    document.getElementById('mg'+i).setAttribute('fill',`rgba(255,80,0,${glowOp})`);
    if(pct>3) document.getElementById('ml'+i).setAttribute('fill','#777');
  });
}

// Particle effect: spawn a dot flying from region A to B
const particles=[];
function spawnParticle(fromIdx,toIdx){
  const a=REGIONS[fromIdx], b=REGIONS[toIdx];
  particles.push({x:a.mx,y:a.my,tx:b.mx,ty:b.my,t:0,speed:.04+Math.random()*.03});
}
let particleTick=0;
function tickParticles(){
  const pg=document.getElementById('map-particles');
  // Clear old particle elements
  while(pg.firstChild) pg.removeChild(pg.firstChild);
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.t+=p.speed;
    if(p.t>=1){particles.splice(i,1);continue;}
    const x=p.x+(p.tx-p.x)*p.t;
    const y=p.y+(p.ty-p.y)*p.t;
    const op=Math.min(1,Math.sin(p.t*Math.PI)*1.5);
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('cx',x); c.setAttribute('cy',y); c.setAttribute('r','2');
    c.setAttribute('fill',`rgba(255,120,30,${op.toFixed(2)})`);
    pg.appendChild(c);
  }
  requestAnimationFrame(tickParticles);
}

// ═══════════════════════════════════════════════════════
//  REGION GRID (cards below map)
// ═══════════════════════════════════════════════════════
function buildGrid(){
  const g=document.getElementById('rgrid'); g.innerHTML='';
  REGIONS.forEach((r,i)=>{
    const d=document.createElement('div');
    d.className='rcard'; d.id='rc'+i;
    d.innerHTML=`<div class="rname">${r.n.toUpperCase()}</div>
      <div class="rpct" id="rp${i}" style="color:#4dff91">0%</div>
      <div class="rbar-bg"><div class="rbar" id="rb${i}" style="width:0%;background:#4dff91"></div></div>`;
    g.appendChild(d);
  });
}

function cardClass(pct){
  if(pct<5)  return 'rcard';
  if(pct<25) return 'rcard lo';
  if(pct<60) return 'rcard mid';
  return 'rcard hi';
}

// ═══════════════════════════════════════════════════════
//  UI UPDATES
// ═══════════════════════════════════════════════════════
function setPhase(txt,cls){
  const el=document.getElementById('phase');
  el.textContent=txt; el.className='phase '+cls;
}
function addLog(msg,cls=''){
  const b=document.getElementById('logbody');
  const d=document.createElement('div');
  d.className='le'+(cls?' '+cls:''); d.textContent=msg;
  b.appendChild(d); b.scrollTop=b.scrollHeight;
  while(b.children.length>28) b.removeChild(b.firstChild);
}
function flashAction(name){
  const el=document.getElementById('aflash');
  el.textContent='⬡ EVOLVED: '+name.toUpperCase();
  el.className='aflash on';
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.className='aflash',2200);
}
function showResult(won,turn,infP,deadP){
  document.getElementById('rico').textContent=won?'☣':'💉';
  const t=document.getElementById('rtitle');
  t.textContent=won?'WORLD ELIMINATED':'CURE FOUND';
  t.className='rtitle '+(won?'win':'lose');
  document.getElementById('rstats').innerHTML=
    `<b>Turn</b> ${turn}<br><b>Infected</b> ${infP.toFixed(1)}%<br><b>Dead</b> ${deadP.toFixed(1)}%`;
  document.getElementById('rovl').className='rovl show';
}
function hideResult(){ document.getElementById('rovl').className='rovl' }

function updateUI(g){
  const tot=g._tp();
  const infP=g._ti()/tot*100, deadP=g._td()/tot*100, cureP=g.cure*100;
  document.getElementById('v-inf').textContent=infP.toFixed(1)+'%';
  document.getElementById('b-inf').style.width=Math.min(100,infP)+'%';
  document.getElementById('v-dead').textContent=deadP.toFixed(1)+'%';
  document.getElementById('b-dead').style.width=Math.min(100,deadP)+'%';
  document.getElementById('v-cure').textContent=cureP.toFixed(1)+'%';
  document.getElementById('b-cure').style.width=cureP+'%';
  document.getElementById('v-dna').textContent=Math.floor(g.dna);
  document.getElementById('b-dna').style.width=Math.min(100,g.dna/2)+'%';
  document.getElementById('s-turn').textContent=String(g.turn).padStart(3,'0');

  for(let i=0;i<12;i++){
    const r=g.regions[i];
    const pct=r.inf/r.pop*100;
    const col=infCol(pct);
    document.getElementById('rp'+i).textContent=pct.toFixed(1)+'%';
    document.getElementById('rp'+i).style.color=col;
    document.getElementById('rb'+i).style.width=Math.min(100,pct)+'%';
    document.getElementById('rb'+i).style.background=col;
    const card=document.getElementById('rc'+i);
    card.className=cardClass(pct);
    const hasDot=card.querySelector('.det-dot');
    if(r.det&&!hasDot){const dot=document.createElement('div');dot.className='det-dot';card.appendChild(dot);}
  }
  updateMap(g);
}

// ═══════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════
let agent=null, game=null, loopTimer=null;
let isTraining=false, isPlaying=false;
let trainEp=0, wins=0;

// ═══════════════════════════════════════════════════════
//  TRAINING
// ═══════════════════════════════════════════════════════
async function startTraining(){
  if(isTraining||isPlaying) return;
  isTraining=true; trainEp=0; wins=0;
  hideResult();
  document.getElementById('btn-train').disabled=true;
  document.getElementById('btn-play').disabled=true;
  document.getElementById('btn-stop').disabled=false;
  setPhase('● TRAINING…','ph-train');
  document.getElementById('tnote').textContent='Teaching the AI to infect the world…';
  addLog('Starting: '+TRAIN_EPS+' training episodes');
  agent=new DQNAgent(); game=new PlagueGame();

  async function ep(){
    if(!isTraining) return;
    game.reset();
    agent.epsilon=Math.max(.05,1-trainEp/200);
    let state=game._state();
    let steps=0;
    while(!game.done&&steps<MAX_TURNS){
      const v=game.validActions();
      const a=agent.act(state,v);
      const{state:ns,reward,done}=game.step(a);
      agent.remember(state,a,reward,ns,done);
      agent.train();
      state=ns; steps++;
    }
    if(game.won) wins++;
    trainEp++;
    const pct=trainEp/TRAIN_EPS*100;
    document.getElementById('ep-stat').textContent=trainEp+' / '+TRAIN_EPS+' episodes';
    document.getElementById('tpfill').style.width=pct+'%';
    document.getElementById('wr-stat').textContent='Win rate: '+(wins/trainEp*100).toFixed(0)+'%';
    updateUI(game);
    if(trainEp%20===0){
      const infP=(game._ti()/game._tp()*100).toFixed(1);
      addLog(`Ep ${trainEp} ${game.won?'WIN ✓':'loss'}  inf=${infP}%  ε=${agent.epsilon.toFixed(2)}`,game.won?'win':'');
      // spawn a few particles on the map to show activity
      const ri=~~(Math.random()*12), ri2=(ri+~~(Math.random()*3)+1)%12;
      spawnParticle(ri,ri2);
    }
    if(trainEp>=TRAIN_EPS){done_train();return;}
    if(trainEp%5===0) await new Promise(r=>setTimeout(r,0));
    ep();
  }
  ep();
}

function done_train(){
  isTraining=false;
  setPhase('● TRAINED  ✓','ph-done');
  document.getElementById('tnote').textContent='Training complete — win rate: '+(wins/TRAIN_EPS*100).toFixed(0)+'%';
  document.getElementById('btn-play').disabled=false;
  document.getElementById('btn-stop').disabled=true;
  document.getElementById('btn-train').disabled=false;
  addLog('Training done! Win rate: '+(wins/TRAIN_EPS*100).toFixed(0)+'%','win');
}

// ═══════════════════════════════════════════════════════
//  PLAY
// ═══════════════════════════════════════════════════════
function startPlay(){
  if(isPlaying) return;
  if(!agent){addLog('Train first!','bad');return;}
  isPlaying=true; hideResult();
  document.getElementById('btn-play').disabled=true;
  document.getElementById('btn-stop').disabled=false;
  document.getElementById('logbody').innerHTML='';
  setPhase('☣ AI PLAYING','ph-play');
  game=new PlagueGame(); agent.epsilon=0;
  document.getElementById('dname').textContent=genName();
  addLog('New game — AI is playing…','ev');
  loopTimer=setInterval(playStep,110);
}

function playStep(){
  if(!isPlaying){clearInterval(loopTimer);return;}
  if(game.done){
    clearInterval(loopTimer); isPlaying=false;
    document.getElementById('btn-play').disabled=false;
    document.getElementById('btn-stop').disabled=true;
    const tot=game._tp();
    const infP=game._ti()/tot*100, deadP=game._td()/tot*100;
    if(game.won){
      setPhase('☣ WORLD GONE','ph-done');
      addLog('AI WINS in '+game.turn+' turns!','win');
    } else {
      setPhase('💉 CURED','ph-idle');
      addLog('AI lost — cure completed at turn '+game.turn,'bad');
    }
    showResult(game.won,game.turn,infP,deadP);
    return;
  }
  const v=game.validActions();
  const a=agent.act(game._state(),v);
  const prevInfPcts=game.regions.map(r=>r.inf/r.pop);
  game.step(a);
  updateUI(game);
  if(a!==0){
    flashAction(ACTIONS[a].n);
    addLog('T'+game.turn+': EVOLVE → '+ACTIONS[a].n+' (−'+ACTIONS[a].c+' DNA)','ev');
  }
  // Spawn spread particles for regions that just gained infection
  game.regions.forEach((r,i)=>{
    const newPct=r.inf/r.pop;
    if(newPct-prevInfPcts[i]>0.001&&Math.random()<.3){
      const nbr=EDGES.filter(e=>e.includes(i)).map(e=>e[0]===i?e[1]:e[0]);
      if(nbr.length) spawnParticle(i,nbr[~~(Math.random()*nbr.length)]);
    }
  });
}

function stopAll(){
  isTraining=false; isPlaying=false;
  clearInterval(loopTimer);
  document.getElementById('btn-stop').disabled=true;
  document.getElementById('btn-train').disabled=false;
  if(agent) document.getElementById('btn-play').disabled=false;
  setPhase('● STOPPED','ph-idle');
  addLog('Stopped.');
}

// ═══════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════
buildMap();
buildGrid();
game=new PlagueGame();
updateUI(game);
document.getElementById('dname').textContent=genName();
requestAnimationFrame(tickParticles);
</script>
